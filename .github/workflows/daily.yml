name: PlayBlox Studio - Video Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Gaming video topic"
        required: true
        default: "Minecraft survival adventure"

permissions:
  contents: read

jobs:
  generate-video:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install video and narration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libportaudio2 wget
          pip install gTTS kokoro-tts

      - name: Download Kokoro voice models
        run: |
          wget -q --show-progress https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/kokoro-v1.0.onnx
          wget -q --show-progress https://github.com/nazdridoy/kokoro-tts/releases/download/v1.0.0/voices-v1.0.bin

          
      - name: Generate video
        run: |
          python generate.py "${{ github.event.inputs.topic }}" 

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: playblox-video
          path: output/
          if-no-files-found: error
